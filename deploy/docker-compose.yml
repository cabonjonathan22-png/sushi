# Production sur un VPS (Hetzner, OVH, Scaleway…) — voir docs/deploiement.md
#   cp deploy/.env.production.example deploy/.env   (puis compléter)
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: yaoma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis}
      POSTGRES_DB: yaoma
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaoma"]
      interval: 10s
      retries: 10

  # Applique les migrations puis s'arrête (lancé avant l'application à chaque déploiement).
  migrate:
    build: { context: .., target: tools }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yaoma:${POSTGRES_PASSWORD}@db:5432/yaoma
      STORAGE_DIR: /app/storage   # même stockage que l'application (images importées)
    volumes:
      - storage:/app/storage
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: .., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yaoma:${POSTGRES_PASSWORD}@db:5432/yaoma
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # HTTPS automatique (Let's Encrypt). Le flux temps réel (SSE) n'est pas mis en tampon.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?domaine requis}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  # Sauvegarde chiffrable de la base chaque nuit (30 jours conservés) — voir docs/deploiement.md
  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["bash", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  storage:
  caddy_data:
  backups:
